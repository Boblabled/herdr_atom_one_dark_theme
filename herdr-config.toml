onboarding = false

[theme]
# Основа — встроенная one-dark, поверх неё точная палитра Atom One Dark из PyCharm.
name = "one-dark"
auto_switch = false

[theme.custom]
# Поверхности: фон редактора, боковые панели, строки и выделение.
panel_bg = "#282c34"
sidebar_bg = "#21252b"
surface_dim = "#21252b"
surface0 = "#2c313a"
surface1 = "#3e4451"
active_row_bg = "#2c313c"
selection_bg = "#3e4451"

# Текст: основной, вторичный, приглушённый (как комментарии в редакторе).
text = "#abb2bf"
subtext0 = "#9da5b4"
overlay1 = "#7f848e"
overlay0 = "#5c6370"

# Акцент — синий интерфейса Atom One Dark в PyCharm (рамки, выделение, навигация).
accent = "#568af2"

# Синтаксическая палитра.
red = "#e06c75"
peach = "#d19a66"
yellow = "#e5c07b"
green = "#98c379"
teal = "#56b6c2"
blue = "#61afef"
mauve = "#c678dd"
